<svg width="128px" height="128px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes circlePop {
        0%   { transform: scale(0.82); opacity: 0; }
        35%  { transform: scale(1.05); opacity: 1; }
        50%  { transform: scale(1);    opacity: 1; }
        100% { transform: scale(1);    opacity: 1; }
      }
      @keyframes drawM {
        0%   { stroke-dashoffset: 24; opacity: 1; }
        40%  { stroke-dashoffset: 0;  opacity: 1; }
        60%  { stroke-dashoffset: 0;  opacity: 1; }
        85%  { stroke-dashoffset: 0;  opacity: 0.15; }
        100% { stroke-dashoffset: 24; opacity: 0; }
      }
      .ms-circle {
        transform-origin: center;
        animation: circlePop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      .ms-path {
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: drawM 2.2s ease-in-out 0.3s infinite;
      }
    </style>
  </defs>
  <circle class="ms-circle" cx="12" cy="12" r="12" fill="#24A1DE"/>
  <path class="ms-path" d="M5 16C5 16 7.5 6 10.5 11.5C13.5 17 16 6 19 16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
